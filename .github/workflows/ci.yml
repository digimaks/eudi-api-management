# CI: build · vet · golangci-lint · govulncheck · race tests + coverage, then
# (on push to a release branch) build the image once, SBOM it, Trivy-gate it,
# push it, and cosign-sign it keyless via GitHub OIDC.
name: ci

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod          # single source of truth — never a hardcoded version
          cache: true
          cache-dependency-path: go.sum

      - run: go mod download
      - run: go mod verify
      - run: go mod tidy -diff             # the committed tree must already be tidy

      # EDIT (only if this repo test-gates behind a build tag, e.g. testhelpers):
      #   add `-tags <tag>` to build/vet/test and `--build-tags <tag>` to golangci-lint.
      - name: Build
        run: go build -tags testhelpers ./...
      - name: Vet
        run: go vet -tags testhelpers ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.1
          args: --build-tags testhelpers

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Test (race + coverage)
        run: go test -tags testhelpers -race -count=1 -coverprofile=coverage.out -covermode=atomic ./...

  # A short fuzz sweep over every Fuzz* target, 30s each. This service parses input
  # a wallet controls, which is the case the fleet template names as the reason to
  # turn this on. Loops per package, never a bare `./...`: `go test -fuzz` rejects a
  # package pattern that expands to more than one package, which a multi-package
  # service always does.
  #
  # EDIT (edit point 1, as elsewhere in this file): the `-tags testhelpers` are not
  # optional here. Without them `go test -list` cannot build a package whose tests sit
  # behind the tag, so its targets are simply not found and the sweep passes having
  # skipped them — measured 2026-09-17: FuzzCreateSessionBody was invisible without it.
  fuzz-short:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Fuzz (30s per target)
        run: |
          for pkg in $(go list -tags testhelpers ./...); do
            targets=$(go test -tags testhelpers -list '^Fuzz' "$pkg" 2>/dev/null | grep '^Fuzz' || true)
            for t in $targets; do
              go test -tags testhelpers -run '^$' -fuzz "^${t}\$" -fuzztime 30s "$pkg"
            done
          done

  image:
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write            # keyless cosign signing via GitHub OIDC — no key custody
    env:
      IMAGE: ghcr.io/${{ github.repository }}   # org-agnostic; the image lives under the repo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compute version (branch-shortsha, baked into main.Version)
        id: ver
        run: echo "version=${GITHUB_REF_NAME}-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Tags + labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=develop,enable=${{ github.ref == 'refs/heads/develop' }}
            type=sha,prefix=sha-,format=short

      # Build once, locally, so the SBOM + Trivy scan act on the EXACT bits before any push.
      - name: Build image (load, no push yet)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          provenance: false
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: SBOM (syft, SPDX JSON)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.IMAGE }}:${{ github.sha }}
          artifact-name: sbom-${{ github.event.repository.name }}-${{ github.sha }}.spdx.json
          output-file: sbom-${{ github.event.repository.name }}-${{ github.sha }}.spdx.json

      # EDIT (Trivy policy):
      #   own-built image  → exit-code: '1'  (block HIGH/CRITICAL — the default here)
      #   upstream base we don't rebuild → exit-code: '0' (report-only)
      - name: Trivy scan gate (HIGH,CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          # The scanner itself, pinned: the action's own default lags its releases.
          version: v0.74.0
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: '1'

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push tags
        run: |
          echo "${{ steps.meta.outputs.tags }}" | while read -r t; do
            [ -z "$t" ] && continue
            docker tag "${{ env.IMAGE }}:${{ github.sha }}" "$t"
            docker push "$t"
          done
          docker push "${{ env.IMAGE }}:${{ github.sha }}"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image (keyless, GitHub OIDC)
        run: |
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "${{ env.IMAGE }}:${{ github.sha }}" | cut -d@ -f2)
          cosign sign --yes "${{ env.IMAGE }}@${DIGEST}"
